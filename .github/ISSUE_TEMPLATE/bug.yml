name: Bug report
description: Report a reproducible problem with synthetic inputs.
body:
  - type: markdown
    attributes:
      value: Do not include real salaries, employers, household details, database files, or credentials. Report security vulnerabilities privately through the Security tab.
  - type: input
    id: revision
    attributes:
      label: Revision and environment
      description: Include the commit, Node version, operating system, and browser when relevant.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps and synthetic inputs
      description: Provide the smallest example that reproduces the problem.
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy
      options:
        - label: This report contains only synthetic data and no credentials.
          required: true
